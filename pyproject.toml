[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfeed"
version = "0.1.0"
description = "Personalized Academic Paper Recommender"
authors = [{ name = "Paper Feed Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "bm25s>=0.1.10",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "adapters>=1.0.0",
    "gliner>=0.2.0",
    "scikit-learn>=1.4.0",
]
extended = [
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

